name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  backend-static-analysis:
    name: Backend / static analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn compile spotbugs:check
        working-directory: backend
        run: mvn -B compile spotbugs:check

  frontend-test:
    name: Frontend / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm test
        working-directory: frontend
        run: npm test

  frontend-static-analysis:
    name: Frontend / static analysis (ESLint + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run lint
        working-directory: frontend
        run: npm run lint
      - name: npm run type-check
        working-directory: frontend
        run: npm run type-check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ローカル開発では `mvn spring-boot:run` を使うが(docs/ローカル開発環境
      # セットアップ.md参照)、CIではjarを一度ビルドしてバックグラウンドの
      # 単一プロセスとして起動する(本番のjava -jar起動に近く、シェル上で
      # プロセスを追跡・待機・終了させやすいための意図的な選択。ローカルの
      # 開発手順自体は変更しない)。
      - name: Build backend jar
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Start backend
        working-directory: backend
        run: nohup java -jar target/*.jar > ../backend.log 2>&1 &

      # frontend/e2e/global-setup.ts と同じ考え方: /api/auth/me への応答が
      # あれば起動完了とみなす(未認証なので401が返るが、それ自体が
      # 「起動している」証拠になる)。接続できない場合だけ待ち続ける。
      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/api/auth/me; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready within the timeout" >&2
          cat backend.log
          exit 1

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # frontend/e2e/README.md がローカル向けに案内している `npx playwright
      # install chromium` に `--with-deps` を加えたCI専用コマンド。素の
      # Ubuntuランナーにはheadless Chromiumに必要なシステムライブラリが
      # 無いため。ローカルの手順(READMEの記載)自体は変更しない。
      - name: Install Playwright Chromium (with system deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: npm run test:e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
            backend.log
          retention-days: 7
