# テスト実行時のみ有効になる設定(@ActiveProfiles("test")で使用)。
#
# 本番・ローカル開発で使うSQLiteファイル(sns.db)には一切触れず、プロセス内だけに存在する
# インメモリSQLiteを使う。file::memory:?cache=shared にすることで、コネクションプール内の
# 複数コネクションから同一のインメモリDBを共有できる(通常のインメモリモードだとコネクション
# ごとに別DBになってしまうため)。JVM/テストプロセスを終了すれば自動的に消え、後片付けは不要。
#
# schema.sql・MyBatisのXMLは本番と完全に同じものをそのまま使う(SQLite方言を変更しない)。
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

# SQLiteは同時書き込みを1本しかさばけないため、プールを1本に絞り
# 「database is locked」によるテストの不安定化を防ぐ。
spring.datasource.hikari.maximum-pool-size=1

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

app.jwt.secret=test-only-secret-key-not-for-production-use-0123456789abcdef
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

app.storage.type=local
app.upload.dir=${java.io.tmpdir}/sns-app-test-uploads
