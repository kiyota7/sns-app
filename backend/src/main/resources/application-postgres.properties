# ECS Fargate + RDS(PostgreSQL)構成向けのプロファイル。
# SPRING_PROFILES_ACTIVE=postgres で有効化する(terraform-fargate/ecs.tf のタスク定義参照)。
#
# 接続先(ホスト・ポート・DB名・ユーザー名・パスワード)はここでは指定せず、
# Spring Bootの緩やかな環境変数バインディング(SPRING_DATASOURCE_URL /
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD)にそのまま委ねる。
# application.properties(SQLite用)がspring.datasource.urlを直接ハードコードして
# いるのと同じ考え方で、環境ごとに変わる値はプロファイル側に書かず環境変数で渡す。
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
# SQLite用マイグレーション(db/migration、AUTOINCREMENT・strftime()等SQLite方言を含む)
# とは別に、PostgreSQL向けに移植したマイグレーションを db/migration-postgres に用意している。
spring.flyway.locations=classpath:db/migration-postgres

# --- MyBatis ---
# マッパーXMLはSQLite/PostgreSQL両プロファイルで共有(DB固有の関数呼び出しは
# 使っていないため、方言分岐は不要)。
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
