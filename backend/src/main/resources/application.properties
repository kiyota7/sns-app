spring.application.name=SnsAppBackend
server.port=8080

# --- SQLite ---
spring.datasource.url=jdbc:sqlite:sns.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- Flyway ---
# db/migration配下のマイグレーションファイルで、起動時にスキーマを最新化する。
spring.flyway.locations=classpath:db/migration
# Flyway導入前から稼働している既存DB(ローカルのsns.db・本番EC2上のDB)は、schema.sql +
# 起動時の手動ALTER TABLE(廃止済みのSchemaMigrationRunner)により、この時点でV5相当
# (avatar_url列追加まで)のスキーマに既に到達している。baseline-on-migrateにより、
# 履歴テーブルを持たない既存DBはV5まで適用済みとして扱い、V1〜V5の再実行(列重複エラー等)を
# 避ける。新規にセットアップする空のDBにはこの設定は影響せず、通常通りV1から順に適用される。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# --- JWT ---
# 本来はterraform.tfvars等と同様、環境変数で上書きする運用にすべきだが、
# 学習用のローカル実行のためデフォルト値を用意している。
app.jwt.secret=${JWT_SECRET:sns-app-local-development-secret-key-change-in-production-0123456789}
# アクセストークン: 15分(短命。通常のAPIリクエストに使用)
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# リフレッシュトークン: 7日間(/api/auth/refreshでアクセストークンを再発行する専用)
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- 投稿画像アップロード ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 保存先: local(デフォルト、開発用のディスク保存) または s3(本番用)
app.storage.type=${APP_STORAGE_TYPE:local}
app.upload.dir=${UPLOAD_DIR:uploads}
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:ap-northeast-1}
