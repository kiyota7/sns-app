spring.application.name=SnsAppBackend
server.port=8080

# --- SQLite ---
spring.datasource.url=jdbc:sqlite:sns.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# --- JWT ---
# 本来はterraform.tfvars等と同様、環境変数で上書きする運用にすべきだが、
# 学習用のローカル実行のためデフォルト値を用意している。
app.jwt.secret=${JWT_SECRET:sns-app-local-development-secret-key-change-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
