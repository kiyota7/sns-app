spring.application.name=SnsAppBackend
server.port=8080

# --- SQLite ---
spring.datasource.url=jdbc:sqlite:sns.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# --- JWT ---
# 本来はterraform.tfvars等と同様、環境変数で上書きする運用にすべきだが、
# 学習用のローカル実行のためデフォルト値を用意している。
app.jwt.secret=${JWT_SECRET:sns-app-local-development-secret-key-change-in-production-0123456789}
# アクセストークン: 15分(短命。通常のAPIリクエストに使用)
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# リフレッシュトークン: 7日間(/api/auth/refreshでアクセストークンを再発行する専用)
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
